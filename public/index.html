<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link rel="icon" href="/assets/heart_teller.png" type="image/png">
    <title>Ouija Board</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 45%, #3d2b1f 0%, #1a0e08 60%, #080402 100%);
            overflow: hidden;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            height: 100vh;
            width: 100vw;
        }

        /* SVG pattern overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('/assets/board_pattern.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.08;
            pointer-events: none;
            z-index: 1;
            filter: invert(1) sepia(1) saturate(2) hue-rotate(5deg);
        }

        /* START SCREEN */
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a0e08 0%, #050201 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        #start-screen h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2.5rem, 5vw, 5rem);
            letter-spacing: 0.3em;
            color: #d4af37;
            animation: flicker 3s infinite alternate;
            text-align: center;
        }

        #start-screen p {
            font-style: italic;
            font-size: 1rem;
            color: #8a6c3a;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
        }

        @keyframes flicker {

            0%,
            100% {
                text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
                opacity: 0.9;
            }

            50% {
                text-shadow: 0 0 40px rgba(212, 175, 55, 0.8), 0 0 80px rgba(212, 175, 55, 0.2);
                opacity: 1;
            }
        }

        .spirit-btn {
            background: transparent;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.6);
            padding: 16px 48px;
            font-size: 1rem;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 4px;
            position: relative;
            transition: 0.3s;
            outline: none;
        }

        .spirit-btn::before,
        .spirit-btn::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #d4af37;
            border-style: solid;
        }

        .spirit-btn::before {
            top: -3px;
            left: -3px;
            border-width: 2px 0 0 2px;
        }

        .spirit-btn::after {
            bottom: -3px;
            right: -3px;
            border-width: 0 2px 2px 0;
        }

        .spirit-btn:hover {
            background: rgba(212, 175, 55, 0.08);
        }

        /* BOARD */
        #board-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px 6vw 16px;
            z-index: 2;
        }

        /* Decorative pattern overlays — corners */
        .corner-pattern {
            position: fixed;
            width: 260px;
            height: 260px;
            opacity: 0.12;
            pointer-events: none;
            z-index: 3;
        }

        .corner-pattern img {
            width: 100%;
            height: 100%;
        }

        .corner-pattern.tl {
            top: 0;
            left: 0;
            transform: rotate(0deg);
        }

        .corner-pattern.tr {
            top: 0;
            right: 0;
            transform: rotate(90deg);
        }

        .corner-pattern.bl {
            bottom: 0;
            left: 0;
            transform: rotate(270deg);
        }

        .corner-pattern.br {
            bottom: 0;
            right: 0;
            transform: rotate(180deg);
        }

        /* Title — BIG with glow */
        #board-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(3rem, 6.5vw, 7rem);
            letter-spacing: 0.5em;
            color: #d4af37;
            opacity: 0.85;
            text-shadow: 0 0 60px rgba(212, 175, 55, 0.2), 0 2px 20px rgba(0, 0, 0, 0.9);
            text-align: center;
            line-height: 1;
        }

        /* YES / NO — big, wide apart */
        .yes-no-row {
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 0 6vw;
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 4.5vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.5em;
            opacity: 0.65;
            pointer-events: none;
        }

        /* Decorative divider with ornament */
        .divider {
            display: flex;
            align-items: center;
            width: 80%;
            gap: 16px;
            opacity: 0.35;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
        }

        .divider-symbol {
            font-size: 1.2rem;
            color: #d4af37;
            flex-shrink: 0;
        }

        /* Letter rows — big with spacing */
        .letters-row {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 3.8vw, 4.5rem);
            font-weight: 400;
            letter-spacing: clamp(0.4em, 2.5vw, 0.9em);
            opacity: 0.55;
            text-align: center;
            pointer-events: none;
            line-height: 1;
            width: 100%;
        }

        /* Numbers */
        .numbers-row {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 3vw, 3.6rem);
            letter-spacing: clamp(0.4em, 2.8vw, 1em);
            opacity: 0.42;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        /* Game UI */
        #game-ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Good bye */
        .goodbye-row {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(0.9rem, 1.5vw, 1.6rem);
            letter-spacing: 0.6em;
            opacity: 0.25;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* QR  */
        #qr-canvas {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px !important;
            height: 120px !important;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            z-index: 10;
        }

        /* PLANCHETTE */
        #planchette {
            position: absolute;
            width: 250px;
            height: auto;
            z-index: 100;
            cursor: none;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.8));
            pointer-events: none;
        }

        #planchette img {
            width: 100%;
            height: auto;
        }

        /* ── GHOST ── */
        #ghost-container {
            position: fixed;
            width: 320px;
            height: 457px;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
            transition: opacity 0.5s ease-in;
            animation: ghostFloat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(150, 200, 255, 0.5));
        }

        @keyframes ghostFloat {

            0%,
            100% {
                transform: translateY(0px) rotate(-1.5deg);
            }

            50% {
                transform: translateY(-25px) rotate(1.5deg);
            }
        }

        #ghost-face-img {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center top;
        }

        .smoke {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180, 210, 255, 0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 998;
            animation: smokeFade 1.8s ease-out forwards;
        }

        @keyframes smokeFade {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(3) translateY(-40px);
            }
        }

        #otherCamera {
            display: none;
        }

        /* GAME POPUP */
        #game-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(6, 3, 1, 0.96);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 50px 80px;
            text-align: center;
            z-index: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            min-width: 500px;
        }

        #game-popup.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* corner brackets */
        #game-popup::before,
        #game-popup::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #d4af37;
            border-style: solid;
        }

        #game-popup::before {
            top: -4px;
            left: -4px;
            border-width: 2px 0 0 2px;
        }

        #game-popup::after {
            bottom: -4px;
            right: -4px;
            border-width: 0 2px 2px 0;
        }

        #popup-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.4rem, 2.5vw, 2.4rem);
            letter-spacing: 0.3em;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            margin-bottom: 16px;
        }

        #popup-sub {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.75rem, 1.2vw, 1rem);
            letter-spacing: 0.25em;
            color: rgba(212, 175, 55, 0.5);
            font-style: italic;
        }

        /* WORD DISPLAY */
        #word-display {
            display: flex;
            gap: clamp(8px, 1.5vw, 20px);
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 3vw, 3rem);
            letter-spacing: 0.15em;
            justify-content: center;
        }

        .word-slot {
            color: rgba(212, 175, 55, 0.2);
            min-width: 1.1em;
            text-align: center;
            transition: all 0.3s ease;
        }

        .word-slot.revealed {
            color: #fff8dc;
            text-shadow: 0 0 15px rgba(255, 220, 100, 0.9), 0 0 30px rgba(255, 180, 0, 0.5);
            border-bottom-color: #d4af37;
            animation: letterReveal 0.4s ease-out;
        }

        @keyframes letterReveal {
            0% {
                transform: scale(1.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>Ouija Board</h1>
        <p>something is waiting on the other side</p>
        <button id="begin-btn" class="spirit-btn">Begin Séance</button>
    </div>
    <!-- BOARD -->
    <div id="board-wrap">
        <div id="board-title">Ouija Board</div>

        <div class="yes-no-row board-content">
            <span>YES</span>
            <span>NO</span>
        </div>

        <div class="divider"><span class="divider-symbol">✦</span></div>

        <div class="letters-row board-content">
            <p>A B C D E F G H I J K L M</p>
        </div>
        <div class="letters-row board-content">
            <p>N O P Q R S T U V W X Y Z</p>
        </div>

        <div class="divider"><span class="divider-symbol">✦</span></div>

        <div class="numbers-row board-content">
            <p>1 2 3 4 5 6 7 8 9 0</p>
        </div>

        <div class="goodbye-row">✦</div>
    </div>

    <!-- GAME UI -->
    <div id="game-popup">
        <div id="popup-title"></div>
        <div id="popup-sub"></div>
    </div>
    <div id="game-ui">
        <div id="word-display"></div>
    </div>

    <canvas id="qr-canvas"></canvas>
    <div id="planchette">
        <img src="/assets/heart_teller.png" id="planchette-img" alt="planchette">
    </div>
    <div id="ghost-container">
        <div id="ghost-face-img"></div>
    </div>
    <video id="otherCamera" playsinline autoplay muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"
        integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="desktop.js"></script>
</body>

</html>
