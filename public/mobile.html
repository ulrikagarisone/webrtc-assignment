<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Spirit Guide</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #2c1e14 0%, #120a05 100%);
            color: #d4af37;
            font-family: 'Garamond', 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        #intro-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            color: #d4af37;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {

            0%,
            100% {
                text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 30px rgba(212, 175, 55, 0.7);
                transform: scale(1.01);
            }
        }

        p {
            font-style: italic;
            font-size: 1.2rem;
            margin: 0;
            color: #a68b5b;
        }

        #start {
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 15px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
            transition: 0.3s;
        }

        #start:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        #planchette-img {
            width: 300px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
            transition: transform 0.1s ease-out;
        }

        #planchette-ui {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        #letter-display {
            font-size: 7rem;
            min-height: 100px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 4px;
        }

        #letter-display.pop {
            animation: letterPop 0.4s ease-out forwards;
        }

        @keyframes flashFade {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes letterPop {
            0% {
                transform: scale(1);
                opacity: 0;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .instruction {
        margin-top: 10px;
        font-size: 1.25rem;
        letter-spacing: 1px;
        color: #d4af37;
        animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="intro-ui">
        <h1>Ouija</h1>
        <p>Commune with the world beyond...</p>
        <button id="start">Enter Circle</button>
    </div>
    <div id="planchette-ui">
        <div id="letter-display"></div>
        <img src="/assets/heart_teller.png" id="planchette-img" alt="Planchette">
        <p class="instruction">TILT TO GUIDE THE SPIRITS</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="mobile.js"></script>
</body>

</html>
