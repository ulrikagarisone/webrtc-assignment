<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Spirit Guide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative&family=Inter:wght@300;400&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at center, #1a0e08 0%, #080402 100%);
            color: #d4af37;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ── INTRO ── */
        #intro-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 30px 20px;
            width: 100%;
            min-height: 100vh;
        }

        #intro-ui h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.8rem;
            letter-spacing: 6px;
            color: #d4af37;
            animation: flicker 3s infinite alternate;
            line-height: 1.1;
        }

        #intro-ui p {
            font-style: italic;
            font-size: 1rem;
            color: #8a6c3a;
            letter-spacing: 1px;
        }

        .safari-note {
            font-size: 0.65rem !important;
            color: #5a3c1a !important;
            letter-spacing: 0.5px !important;
        }

        @keyframes flicker {

            0%,
            100% {
                text-shadow: 0 0 10px rgba(212, 175, 55, 0.3), 0 0 2px #000;
                opacity: 0.9;
            }

            50% {
                text-shadow: 0 0 35px rgba(212, 175, 55, 0.8), 0 0 60px rgba(212, 175, 55, 0.2);
                opacity: 1;
            }
        }

        /* ── BUTTONS ── */
        .spirit-btn {
            background: transparent;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.6);
            padding: 14px 36px;
            font-size: 1rem;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 4px;
            position: relative;
            transition: 0.3s;
            outline: none;
        }

        .spirit-btn::before,
        .spirit-btn::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #d4af37;
            border-style: solid;
        }

        .spirit-btn::before {
            top: -3px;
            left: -3px;
            border-width: 2px 0 0 2px;
        }

        .spirit-btn::after {
            bottom: -3px;
            right: -3px;
            border-width: 0 2px 2px 0;
        }

        .spirit-btn:active {
            background: rgba(212, 175, 55, 0.08);
        }

        /* ── FACE CAPTURE ── */
        #face-capture-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }

        #ghost-cutout {
            position: relative;
            width: 220px;
            flex-shrink: 0;
        }

        /* Camera preview sits behind ghost image */
        #face-preview-wrap {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 105px;
            height: 128px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 1;
        }

        #face-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Ghost image sits on top — face shows through naturally */
        #ghost-overlay {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(120, 160, 255, 0.2));
        }

        /* Pulsing oval border */
        #face-oval-border {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 111px;
            height: 134px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 3;
            animation: ovalPulse 2s ease-in-out infinite;
        }

        @keyframes ovalPulse {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 30px rgba(212, 175, 55, 0.8), inset 0 0 10px rgba(0, 0, 0, 0.3);
            }
        }

        #face-caption {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: #6a4c2a;
            margin-top: 6px;
            font-style: italic;
        }

        #face-instruction {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4af37;
            margin-top: 16px;
            font-style: normal;
            animation: pulse 2s infinite;
        }

        #capture-btn-wrap {
            margin-top: 20px;
        }

        /* ── PLANCHETTE UI ── */
        #planchette-ui {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
            gap: 10px;
        }

        #planchette-img {
            width: 280px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.9));
            transition: transform 0.1s ease-out;
        }

        #letter-display {
            font-size: 6rem;
            min-height: 90px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 4px;
            font-family: 'Cinzel Decorative', serif;
        }

        #letter-display.pop {
            animation: letterPop 0.4s ease-out forwards;
        }

        @keyframes letterPop {
            0% {
                transform: scale(1);
                color: #d4af37;
            }

            40% {
                transform: scale(1.7);
                color: #fff8dc;
                text-shadow: 0 0 40px rgba(255, 220, 100, 0.9);
            }

            100% {
                transform: scale(1.1);
                color: #d4af37;
            }
        }

        @keyframes flashFade {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .instruction {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #6a4c2a;
            font-style: normal;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- INTRO -->
    <div id="intro-ui">
        <h1>OUIJA</h1>
        <p>Commune with the world beyond...</p>
        <button id="start" class="spirit-btn">Enter Circle</button>
    </div>

    <!-- FACE CAPTURE — ghost cutout board style -->
    <div id="face-capture-ui">
        <div id="ghost-cutout">
            <div id="face-preview-wrap">
                <video id="face-preview" playsinline autoplay muted></video>
            </div>
            <div id="face-oval-border"></div>
            <img src="/assets/ghost.png" id="ghost-overlay" alt="ghost">
        </div>

        <p id="face-caption"> Spirits may judge your face</p>
        <p id="face-instruction">the ghost needs a face. yours will do.</p>
        <div id="capture-btn-wrap">
            <button id="capture-btn" class="spirit-btn">SACRIFICE SELFIE </button>
        </div>
    </div>

    <!-- PLANCHETTE -->
    <div id="planchette-ui">
        <div id="letter-display"></div>
        <img src="/assets/heart_teller.png" id="planchette-img" alt="Planchette">
        <p class="instruction">tilt to guide the spirits</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="mobile.js"></script>
</body>

</html>
